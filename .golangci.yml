run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - contextcheck
    - dupl
    - gocognit
    - gocyclo
    - gosec

linters-settings:
  gocyclo:
    min-complexity: 25
  gocognit:
    min-complexity: 35
  dupl:
    threshold: 150

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
