sonar.projectKey=rae-suite-go
sonar.projectName=RAE Suite Go
sonar.projectVersion=2.9.0
sonar.sourceEncoding=UTF-8

sonar.sources=cmd,pkg,services
sonar.tests=cmd,pkg,services
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/vendor/**,**/testdata/**,**/dist/**,**/node_modules/**,**/*.pb.go

sonar.go.coverage.reportPaths=coverage.out
sonar.go.tests.reportPaths=test-report.json
sonar.go.golangci-lint.reportPaths=golangci-lint.xml
